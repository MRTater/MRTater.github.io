about_me: "I am a Ph.D. student in the Individualized Interdisciplinary Program (AI for Multimedia) at the Hong Kong University of Science and Technology, supervised by <a href='https://yunyasong.github.io/'>Prof. Yunya Song</a> and <a href='https://anyirao.com/'>Prof. Anyi Rao</a>. My research spans efficient generative language models, multimodal reasoning and generation, and trustworthy AI agents. I am particularly interested in diffusion and linear-time language models, financial AI and social computing, and AI security topics such as LLM watermarking and linguistic steganography. Before starting my Ph.D., I was an AI Researcher at Huawei's Singapore Research Center, where I worked on large language models."

